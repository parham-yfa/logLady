<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Generate App Icons</title>
  <style>
    body { font-family: sans-serif; max-width: 500px; margin: 60px auto; text-align: center; background: #f5f5f5; }
    button { margin-top: 24px; padding: 14px 32px; font-size: 16px; background: #2D3436; color: white; border: none; border-radius: 12px; cursor: pointer; }
    button:hover { background: #444; }
    #preview { margin: 24px auto; display: block; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.15); }
    #status { margin-top: 16px; color: #555; font-size: 14px; }
  </style>
</head>
<body>
  <h2>Log Lady — Icon Generator</h2>
  <p>Preview of the yoga icon:</p>
  <canvas id="preview" width="150" height="150"></canvas>
  <br>
  <button onclick="generateAll()">Download All Icons</button>
  <div id="status"></div>

  <script>
    const svgSource = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" rx="22" fill="#2D3436"/>
  <circle cx="50" cy="27" r="9" fill="white"/>
  <path d="M45 43 C38 39 30 33 32 22" stroke="white" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M55 43 C62 39 70 33 68 22" stroke="white" stroke-width="4" fill="none" stroke-linecap="round"/>
  <line x1="50" y1="36" x2="50" y2="54" stroke="white" stroke-width="4" stroke-linecap="round"/>
  <path d="M36 68 C42 57 58 57 64 68" stroke="white" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M28 68 C37 78 50 74 50 74 C50 74 63 78 72 68" stroke="white" stroke-width="4" fill="none" stroke-linecap="round"/>
</svg>`;

    // Render preview on load
    renderToCanvas(150, 1.0).then(c => {
      const preview = document.getElementById('preview');
      const ctx = preview.getContext('2d');
      ctx.drawImage(c, 0, 0);
    });

    function renderToCanvas(size, scale = 1.0) {
      return new Promise((resolve) => {
        const canvas = document.createElement('canvas');
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext('2d');
        const img = new Image();
        const blob = new Blob([svgSource], { type: 'image/svg+xml' });
        const url = URL.createObjectURL(blob);
        img.onload = () => {
          // For maskable icons, scale icon to 80% (safe zone) and center
          const offset = size * (1 - scale) / 2;
          const drawSize = size * scale;
          ctx.drawImage(img, offset, offset, drawSize, drawSize);
          URL.revokeObjectURL(url);
          resolve(canvas);
        };
        img.src = url;
      });
    }

    function downloadCanvas(canvas, filename) {
      return new Promise(resolve => {
        const a = document.createElement('a');
        a.download = filename;
        a.href = canvas.toDataURL('image/png');
        a.click();
        setTimeout(resolve, 300); // small delay between downloads
      });
    }

    async function generateAll() {
      const status = document.getElementById('status');
      const files = [
        { name: 'favicon.png',              size: 32,  scale: 1.0 },
        { name: 'Icon-192.png',             size: 192, scale: 1.0 },
        { name: 'Icon-512.png',             size: 512, scale: 1.0 },
        { name: 'Icon-maskable-192.png',    size: 192, scale: 0.8 },
        { name: 'Icon-maskable-512.png',    size: 512, scale: 0.8 },
      ];

      for (const file of files) {
        status.textContent = `Generating ${file.name}…`;
        const canvas = await renderToCanvas(file.size, file.scale);
        await downloadCanvas(canvas, file.name);
      }

      status.innerHTML = `✅ Done! Place the downloaded files:<br><br>
        <code>favicon.png</code> → <code>web/favicon.png</code><br>
        <code>Icon-*.png</code> → <code>web/icons/</code>`;
    }
  </script>
</body>
</html>
